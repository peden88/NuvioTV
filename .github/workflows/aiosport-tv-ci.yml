name: AIOSport TV CI

on:
  push:
    branches:
      - feature/aiosport-tv
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aiosport-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build AIOSport TV debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Create CI properties
        run: |
          printf '%s\n' \
            'NUVIO_SUPABASE_URL=https://ci.invalid.example' \
            'NUVIO_SUPABASE_ANON_KEY=ci-placeholder' \
            'AIOSPORT_API_BASE_URL=https://sports-ci.invalid.example' \
            > local.properties

      - name: Build AIOSport TV
        run: ./gradlew :app:assembleAiosportDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: aiosport-tv-debug-${{ github.sha }}
          path: app/build/outputs/apk/aiosport/debug/*.apk
          if-no-files-found: error
          retention-days: 7
