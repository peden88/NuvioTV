name: Anime Calendar TV APK

on:
  push:
    branches:
      - feature/anime-calendar-tv
    paths:
      - "anime-calendar-tv/**"
      - ".github/workflows/anime-calendar-tv.yml"
      - ".github/test-signing/anime-calendar-tv.jks.b64"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: anime-calendar-tv-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Install stable TV signing identity
        run: |
          base64 -d .github/test-signing/anime-calendar-tv.jks.b64 > anime-calendar-tv/anime-calendar-tv.jks
          keytool -list -keystore anime-calendar-tv/anime-calendar-tv.jks \
            -storepass animecalendar-tv-test -alias animecalendartv >/dev/null

      - name: Build signed release APK
        env:
          ANIME_TV_KEYSTORE_FILE: anime-calendar-tv.jks
          ANIME_TV_KEYSTORE_PASSWORD: animecalendar-tv-test
          ANIME_TV_KEY_ALIAS: animecalendartv
          ANIME_TV_KEY_PASSWORD: animecalendar-tv-test
        run: |
          export ANIME_TV_VERSION_CODE=$((300000 + GITHUB_RUN_NUMBER))
          export ANIME_TV_VERSION_NAME="1.0.${GITHUB_RUN_NUMBER}-tv"
          gradle -p anime-calendar-tv --no-daemon clean :app:assembleRelease

      - name: Validate package and signature
        run: |
          set -euo pipefail
          SOURCE_APK="anime-calendar-tv/app/build/outputs/apk/release/app-release.apk"
          test -f "$SOURCE_APK"
          cp "$SOURCE_APK" Anime-Calendar-TV.apk

          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)"
          AAPT="$BUILD_TOOLS/aapt"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          "$AAPT" dump badging Anime-Calendar-TV.apk | tee APK-BADGING.txt
          grep -q "package: name='com.peden88.animecalendar.tv'" APK-BADGING.txt
          grep -q "android.software.leanback" APK-BADGING.txt
          "$APKSIGNER" verify --verbose --print-certs Anime-Calendar-TV.apk | tee APK-SIGNATURE.txt
          sha256sum Anime-Calendar-TV.apk | tee APK-SHA256.txt

      - uses: actions/upload-artifact@v4
        with:
          name: Anime-Calendar-TV
          path: |
            Anime-Calendar-TV.apk
            APK-BADGING.txt
            APK-SIGNATURE.txt
            APK-SHA256.txt
          retention-days: 14

      - name: Publish rolling TV release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES="Native Android TV frontend for Anime Calendar. Remote-first Watching, Calendar, Upcoming and Browse screens; add/remove watchlist; long-press quick actions; Open in Nuvio via the nuvio search/detail deep-link contract. Package: com.peden88.animecalendar.tv."
          if gh release view anime-calendar-tv >/dev/null 2>&1; then
            gh release upload anime-calendar-tv \
              Anime-Calendar-TV.apk APK-BADGING.txt APK-SIGNATURE.txt APK-SHA256.txt \
              --clobber
            gh release edit anime-calendar-tv --notes "$NOTES" --prerelease
          else
            gh release create anime-calendar-tv \
              Anime-Calendar-TV.apk APK-BADGING.txt APK-SIGNATURE.txt APK-SHA256.txt \
              --title "Anime Calendar TV" \
              --notes "$NOTES" \
              --target "$GITHUB_SHA" \
              --prerelease
          fi
